name: Test and publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
  # Weekly: rebuild on a freshly pulled base image, so Python and Alpine
  # security fixes reach the published images even when nothing is committed
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - name: Unit tests
        run: |
          python test/test_units.py
          python test/test_time.py
          python test/test_edges.py
          python test/test_features.py
          python test/test_home.py
          python test/test_constraints.py
          python test/test_review.py
          node test/test_sim.mjs
          node test/test_osgrid.mjs
          python tools/osgb.py
          python tools/check_locations.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # all history and tags, for git describe
          persist-credentials: false

      - name: Image name and version
        run: |
          # Registry names must be lower case
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # 1.2.3 for a release, 1.2.3-4-gabc1234 for a later commit, or just
          # the commit before the first release. Reported by /api/status.
          version=$(git describe --tags --always --match 'v[0-9]*')
          echo "VERSION=${version#v}" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          pull: true
          tags: gb-grid:test
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail before publishing if the image has a high or critical
      # vulnerability that already has a fix available
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: gb-grid:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Smoke test (same hardening as the example compose file)
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true gb-grid:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          for page in / /map /stations /static/base.css /static/js/gb.js /geo.json /api/live /api/map /api/alerts /api/replay /regions /regions.json /api/regions /balancing /api/balancing /outages /api/outages /history /api/longterm /api/longterm/summary /api/outlook /static/vendor/uplot.min.js /display /glossary /api/summary /static/js/glossary.js /frequency /api/frequency /api/frequency?range=7d /timeline /api/events /static/pages/frequency.js /static/pages/timeline.js /sandbox /api/sandbox /static/js/gridsim.js /static/pages/sandbox.js /static/js/stationcard.js /static/js/osgrid.js /static/js/feeds.js /home /api/home /static/pages/home.js /api/station?id=10138 /station?id=10138 /static/pages/station.js /static/stationcard.css /api/stations '/api/station?id=10138&full=1' /static/fonts/hanken-grotesk.woff2 /static/fonts/instrument-sans.woff2 /static/display.webmanifest /static/icon-180.png /static/favicon.svg /favicon.ico /api/status /constraints /api/constraints /boundaries.json /static/pages/constraints.js /static/pages/constraints.css /review /api/review '/api/review?year=2019' /static/pages/review.js /static/pages/review.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$page")
            echo "$page $code"
            case "$page:$code" in /api/status:503|*:200) ;; *) exit 1 ;; esac
          done
          docker logs smoke
          docker rm -f smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 and arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub creates new packages as private, which a fork's first run will
      # too. Warn (without failing) if the image can't be pulled anonymously.
      - name: Check the image can be pulled without logging in
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${TAG}" || true)
          if [ "$code" = 200 ]; then
            echo "Public: anyone can pull ${IMAGE}:${TAG}"
          else
            echo "::warning title=Image is private::${IMAGE} can't be pulled without logging in (HTTP ${code}). Make it public under the package's settings, Danger Zone, Change visibility."
          fi

      # Informational only: runs the image against the real APIs for a few
      # minutes and prints what it gets, including units it can't place.
      - name: Live data report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          docker run -d --name live -p 8080:8080 -e CARBON_REGION_ID=2 -e HISTORY_DAYS=2 gb-grid:test
          python3 tools/live_report.py http://127.0.0.1:8080 --wait 480
          docker logs live 2>&1 | tail -40
          docker rm -f live

  # Weekly, also rebuild the latest release (the 1, 1.x and 1.x.y tags) from
  # its own source on a fresh base image, so pinned users get security fixes
  release-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Latest release
        run: |
          tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then echo "No release yet"; echo "TAG=" >> "$GITHUB_ENV"; exit 0; fi
          git checkout --quiet "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image tags
        if: env.TAG != ''
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}

      - if: env.TAG != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - if: env.TAG != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build for the scan
        if: env.TAG != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          tags: gb-grid:release
          build-args: VERSION=${{ env.VERSION }}

      - name: Vulnerability scan
        if: env.TAG != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: gb-grid:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GitHub Container Registry
        if: env.TAG != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 and arm64)
        if: env.TAG != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
