name: Test and publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: |
          python test/test_units.py
          python test/test_time.py
          python test/test_edges.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all history and tags, for git describe

      - name: Image name and version
        run: |
          # Registry names must be lower case
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # 1.2.3 for a release, 1.2.3-4-gabc1234 for a later commit, or just
          # the commit before the first release. Reported by /api/status.
          version=$(git describe --tags --always --match 'v[0-9]*')
          echo "VERSION=${version#v}" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gb-grid:test
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (same hardening as the example compose file)
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true gb-grid:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          for page in / /map /stations /geo.json /api/live /api/map /api/status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$page")
            echo "$page $code"
            case "$page:$code" in /api/status:503|*:200) ;; *) exit 1 ;; esac
          done
          docker logs smoke
          docker rm -f smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 and arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub creates new packages as private, which a fork's first run will
      # too. Warn (without failing) if the image can't be pulled anonymously.
      - name: Check the image can be pulled without logging in
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${TAG}" || true)
          if [ "$code" = 200 ]; then
            echo "Public: anyone can pull ${IMAGE}:${TAG}"
          else
            echo "::warning title=Image is private::${IMAGE} can't be pulled without logging in (HTTP ${code}). Make it public under the package's settings, Danger Zone, Change visibility."
          fi

      # Informational only: runs the image against the real APIs for a few
      # minutes and prints what it gets, including units it can't place.
      - name: Live data report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          docker run -d --name live -p 8080:8080 -e CARBON_REGION_ID=2 -e HISTORY_DAYS=2 gb-grid:test
          python3 tools/live_report.py http://127.0.0.1:8080 --wait 240
          docker logs live 2>&1 | tail -40
          docker rm -f live
