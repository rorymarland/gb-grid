name: Explore station sources

# Run by hand. Looks up unmatched stations in Wikidata, the Renewable Energy
# Planning Database and Wikimedia Commons, and prints what it finds for review.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Station IDs to find candidate photos for (comma-separated); empty for the full run
        default: ''

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - name: Look up stations
        env:
          ONLY: ${{ inputs.only }}
        run: python3 -I tools/explore_stations.py "$RUNNER_TEMP/candidates.csv"
      - name: Contact sheets of candidate photos
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/photo_sheet.py "$RUNNER_TEMP/sheets" "$RUNNER_TEMP/candidates.csv"
          for f in "$RUNNER_TEMP"/sheets/*.jpg; do echo "=====SHEET $(basename "$f") $(sha256sum "$f" | cut -c1-16)====="; base64 -w 100 "$f"; echo '=====END====='; done
