<!doctype html>
<html lang="en-GB">
<head>
<!--#head-->
<title>GB grid display</title>
<link rel="manifest" href="{{static:display.webmanifest}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GB grid">
<meta name="theme-color" content="#0b131c">
<link rel="stylesheet" href="{{static:vendor/uplot.min.css}}">
<link rel="stylesheet" href="{{static:stationmap.css}}">
<link rel="stylesheet" href="{{static:pages/display.css}}">
</head>
<body>
<div class="screen" data-no-glossary>
  <div class="slides" id="slides">
    <div class="catcher" id="catcher" aria-hidden="true"></div>
  </div>
  <div class="bar">
    <div class="clock" id="clock">--:--<small></small></div>
    <div class="where"><b id="view-name"></b><span class="dots" id="dots"></span></div>
    <div class="state"><span id="state"></span><button type="button" id="fs-btn" hidden>Full screen</button><a href="/">Exit</a></div>
  </div>
  <div class="progress"><i id="progress"></i></div>
</div>
<div class="night" id="night" role="button" aria-label="Show the display">
  <div class="t" id="night-clock">--:--</div>
  <p><span id="night-ci"></span><span id="night-demand"></span></p>
</div>
<script src="{{static:vendor/uplot.min.js}}"></script>
<script type="module" src="{{static:pages/display.js}}"></script>
</body>
</html>
